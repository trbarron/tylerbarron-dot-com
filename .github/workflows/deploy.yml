name: 🚀 Deploy

on:
  push:
    branches:
      - master
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Husky git hooks are a local-dev guardrail; skip installing them in CI so they
# never run against semantic-release's automated release commit.
env:
  HUSKY: 0

defaults:
  run:
    shell: bash

jobs:
  lint:
    name: ⬣ ESLint
    runs-on: ubuntu-latest
    steps:
      - name: ⬇️ Checkout repo
        uses: actions/checkout@v7

      - name: ⎔ Setup node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ./package-lock.json

      - name: 📥 Install deps
        run: npm ci

      - name: 🔬 Lint
        run: npm run lint

  format:
    name: ✨ Prettier
    runs-on: ubuntu-latest
    steps:
      - name: ⬇️ Checkout repo
        uses: actions/checkout@v7

      - name: ⎔ Setup node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ./package-lock.json

      - name: 📥 Install deps
        run: npm ci

      # Fails on unformatted files; fix locally with npm run format.
      - name: ✨ Check formatting
        run: npm run format:check

  typecheck:
    name: ʦ TypeScript
    runs-on: ubuntu-latest
    steps:
      - name: ⬇️ Checkout repo
        uses: actions/checkout@v7

      - name: ⎔ Setup node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ./package-lock.json

      - name: 📥 Install deps
        run: npm ci

      - name: 🔎 Type check
        run: npm run typecheck

  test:
    name: 🧪 Vitest
    runs-on: ubuntu-latest
    # A throwaway Redis so the real-Redis tests (Collaborative Checkmate's game
    # engine) run too; without TEST_REDIS_URL they skip. The tests refuse any
    # non-local URL, so this can never point at production.
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: --health-cmd "redis-cli ping" --health-interval 2s --health-timeout 2s --health-retries 15
    steps:
      - name: ⬇️ Checkout repo
        uses: actions/checkout@v7

      - name: ⎔ Setup node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ./package-lock.json

      - name: 📥 Install deps
        run: npm ci

      - name: 🧪 Run tests
        env:
          TEST_REDIS_URL: redis://localhost:6379
        run: npm test

  design:
    name: ◼ Design rules
    runs-on: ubuntu-latest
    steps:
      - name: ⬇️ Checkout repo
        uses: actions/checkout@v7

      - name: ⎔ Setup node
        uses: actions/setup-node@v7
        with:
          node-version: 24

      # Fails on classes DESIGN.md rules out: rounded corners, shadows, italics,
      # hues in the UI, font-sans. Exceptions carry a design-allow comment.
      # Dependency-free, so no npm ci.
      - name: ◼ Check classes against DESIGN.md
        run: node scripts/check-design.mjs

  lambda-deps:
    name: λ Lambda deps
    runs-on: ubuntu-latest
    steps:
      - name: ⬇️ Checkout repo
        uses: actions/checkout@v7

      - name: ⎔ Setup node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ./package-lock.json

      - name: 📥 Install deps
        run: npm ci

      # Assemble server/ as the deploy does (minus asset publishing), then check
      # every package the SSR bundle imports is installed there. A miss 500s
      # for bots and curl only, so no browser test would catch it.
      - name: 🏗 Build the Lambda
        run: npm run compile:mdx && npm run build && npm run build:arc:server && npm run build:arc:deps

      - name: λ Check the Lambda installs what it imports
        run: npm run check:lambda-deps

  og-cards:
    name: 🖼 OG cards
    runs-on: ubuntu-latest
    steps:
      - name: ⬇️ Checkout repo
        uses: actions/checkout@v7

      - name: ⎔ Setup node
        uses: actions/setup-node@v7
        with:
          node-version: 24

      # Fails when a post's OG share card (public/images/og/<slug>.png) or a
      # project card (og/projects/, from projectCards.json) is missing or stale.
      # Dependency-free, so no npm ci. Fix locally: python3 scripts/generate-og-image.py
      - name: 🖼 Check OG cards match posts
        run: node scripts/check-og-images.mjs

  deploy:
    name: 🚀 Deploy
    runs-on: ubuntu-latest
    needs: [lint, format, typecheck, test, design, lambda-deps, og-cards]
    # Only master deploys. PRs run the checks above and stop here, so a PR
    # can never publish assets or overwrite production.
    if: github.ref == 'refs/heads/master'
    # semantic-release pushes the version bump commit, tag, and GitHub release.
    permissions:
      contents: write
      issues: write
      pull-requests: write

    steps:
      - name: ⬇️ Checkout repo
        uses: actions/checkout@v7
        with:
          # Full history + tags so semantic-release can analyze commits since
          # the last release tag.
          fetch-depth: 0

      - name: ⎔ Setup node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          architecture: x64
          cache: npm
          cache-dependency-path: ./package-lock.json

      - name: 📥 Install deps
        run: npm ci

      # Analyze commits since the last release; if a release is warranted, bump
      # package.json on disk, commit/tag (with [skip ci] so it
      # doesn't re-trigger this workflow), and publish a GitHub Release. The bumped
      # package.json is then read by the build below so the footer shows the new
      # version. A no-op when no release-worthy commits exist.
      - name: 🔖 Release (semantic-release)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx semantic-release

      # Create the GitHub Release for the tag semantic-release just pushed.
      # Kept out of semantic-release (and non-blocking) on purpose: this is the
      # only release step that runs after the tag exists but before the deploy,
      # so a flaky GitHub API response here used to abort the deploy and leave
      # a tagged-but-undeployed state (run 27287187104, GitHub outage 2026-06-10).
      # Idempotent: skips when HEAD isn't a fresh release or the Release exists.
      - name: 🏷 GitHub Release (non-blocking)
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG=$(git tag --points-at HEAD | head -n1)
          if [ -n "$TAG" ] && ! gh release view "$TAG" --json id >/dev/null 2>&1; then
            git log -1 --format=%b | gh release create "$TAG" --title "$TAG" --verify-tag --notes-file -
          fi

      # Single source of truth: the same npm scripts used locally. Compiles MDX
      # (image src's rewritten to VITE_CDN_URL), builds client + SSR bundles
      # against the CDN base, bundles the Lambda handler, and installs the
      # Lambda's prod-only deps in server/.
      - name: 🏗 Build
        env:
          NODE_ENV: production
          VITE_CDN_URL: ${{ secrets.VITE_CDN_URL }}
        run: npm run build:arc

      # The asset bucket is an origin on the tylerbarron.com CloudFront
      # distribution (/assets/*, /fonts/*, /images/* behaviors), so everything
      # the browser fetches is same-origin, compressed, and edge-cached. No
      # bucket CORS needed.
      - name: 📤 Publish assets + images to CDN bucket
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: ${{ secrets.AWS_REGION }}
          AWS_BUCKET_NAME: ${{ secrets.AWS_BUCKET_NAME }}
        run: |
          # Content-hashed assets are immutable; --delete prunes stale builds.
          aws s3 sync build/client/assets/ "s3://$AWS_BUCKET_NAME/assets/" \
            --delete \
            --cache-control "public,max-age=31536000,immutable"
          # Fonts have fixed names: skip --delete, shorter TTL.
          [ -d build/client/fonts ] && aws s3 sync build/client/fonts/ "s3://$AWS_BUCKET_NAME/fonts/" \
            --cache-control "public,max-age=86400" || true
          # Blog/post images referenced as /images/* in MDX (rewritten to the CDN).
          # og/manifest.json is a local build artifact for check-og-images.mjs,
          # not a web asset — and it mutates, so it must not be cached immutable.
          # models/, pizza/ and og/projects/ are excluded here and synced
          # separately below: all are replaced in place (a new trophy.glb, a
          # fresh pizza scrape, a re-rendered project card) under fixed
          # filenames, so they can't carry the immutable header the rest of
          # /images/* uses.
          aws s3 sync public/images/ "s3://$AWS_BUCKET_NAME/images/" \
            --exclude "*.db" \
            --exclude "og/manifest.json" \
            --exclude "og/projects/*" \
            --exclude "models/*" \
            --exclude "pizza/*" \
            --cache-control "public,max-age=31536000,immutable"
          # Replaceable 3D models: 1-hour TTL so overwriting a .glb propagates.
          [ -d public/images/models ] && aws s3 sync public/images/models/ "s3://$AWS_BUCKET_NAME/images/models/" \
            --cache-control "public,max-age=3600" || true
          # Pizza-map data (scripts/generate-pizza-data.py). Regenerated in place
          # from the Places scrape, so same 1-hour TTL as models/. CloudFront
          # compresses JSON at the edge: ~700 KB raw, ~76 KB brotli.
          [ -d public/images/pizza ] && aws s3 sync public/images/pizza/ "s3://$AWS_BUCKET_NAME/images/pizza/" \
            --cache-control "public,max-age=3600" || true
          # Project share cards (projectCards.json): re-rendered in place when a
          # card's text or position changes, so the same 1-hour TTL.
          [ -d public/images/og/projects ] && aws s3 sync public/images/og/projects/ "s3://$AWS_BUCKET_NAME/images/og/projects/" \
            --exclude "manifest.json" \
            --cache-control "public,max-age=3600" || true

      - name: 📊 Lambda bundle size
        run: |
          echo "=== Lambda bundle size breakdown ==="
          du -sh server/build server/node_modules server/index.mjs
          echo "--- total server/ ---"
          du -sh server/
          echo "--- top node_modules by size ---"
          du -sh server/node_modules/*/ | sort -rh | head -15

      - name: 🚀 Production Deploy
        run: |
          npm exec arc -- env --add --env production NODE_ENV production || true
          npm exec arc -- deploy --production --prune --verbose --debug
        env:
          CI: true
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
          AWS_BUCKET_NAME: ${{ secrets.AWS_BUCKET_NAME }}
          # GA_TRACKING_ID is NOT set here: arc deploy doesn't pass process env
          # to the Lambda — production reads it from @env in app.arc.
          VITE_CDN_URL: ${{ secrets.VITE_CDN_URL }}
